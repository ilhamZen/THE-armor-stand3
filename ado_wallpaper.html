<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADO // THE CONCERT THAT NEVER ENDS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a0a}body{font-family:"Zen Kaku Gothic New","Yu Gothic",sans-serif;cursor:none}:root{--mode:usseewa;--bg-deep:#10141F;--bg-surface:#171D2E;--accent-primary:#E60023;--accent-deep:#7E0E18;--accent-secondary:#5B6B82;--text-main:#F4EFE6;--spotlight:#E60023;--seal-color:#E60023;--cage-glow:rgba(230,0,35,0.4);--kanji-opacity:0.08}body.mode-stage{--bg-deep:#0E1B33;--bg-surface:#16264A;--accent-primary:#F2B33D;--accent-deep:#B8860B;--accent-secondary:#3EC5F0;--text-main:#F4EFE6;--spotlight:#F2B33D;--seal-color:#F2B33D;--cage-glow:rgba(62,197,240,0.3)}#app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 70% 50%,var(--bg-surface) 0%,var(--bg-deep) 70%);transition:background 0.5s ease}.layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}.layer-bg{z-index:0}.layer-mid{z-index:1}.layer-fg{z-index:2}#disc{position:absolute;right:-15vw;top:50%;transform:translateY(-50%);width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,var(--spotlight) 0%,transparent 70%);opacity:0.6;animation:breathe 12s ease-in-out infinite;filter:blur(40px)}@keyframes breathe{0%,100%{transform:translateY(-50%) scale(1);opacity:0.5}50%{transform:translateY(-50%) scale(1.05);opacity:0.7}}#cage-container{position:absolute;right:10%;top:50%;transform:translateY(-50%);width:35vw;height:75vh;perspective:1000px}#cage-frame{position:relative;width:100%;height:100%;border-left:3px solid var(--accent-secondary);border-right:3px solid var(--accent-secondary);background:linear-gradient(180deg,transparent 0%,var(--cage-glow) 20%,transparent 40%,transparent 60%,var(--cage-glow) 80%,transparent 100%);box-shadow:0 0 60px var(--cage-glow),inset 0 0 40px var(--cage-glow);overflow:hidden}#cage-frame::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.3) 2px,rgba(0,0,0,0.3) 4px);pointer-events:none;z-index:5}.cage-bar{position:absolute;width:2px;height:100%;background:linear-gradient(180deg,transparent,var(--accent-primary),transparent);opacity:0.3;animation:cagePulse 3s ease-in-out infinite}.cage-bar:nth-child(1){left:20%;animation-delay:0s}.cage-bar:nth-child(2){left:40%;animation-delay:0.5s}.cage-bar:nth-child(3){left:60%;animation-delay:1s}.cage-bar:nth-child(4){left:80%;animation-delay:1.5s}@keyframes cagePulse{0%,100%{opacity:0.2;filter:blur(1px)}50%{opacity:0.5;filter:blur(2px)}}#character-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}#character-img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(0.8) contrast(1.2) brightness(0.9);animation:kenBurns 20s ease-in-out infinite alternate;transition:opacity 0.5s ease}#character-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,transparent 0%,rgba(230,0,35,0.15) 100%);mix-blend-mode:overlay;pointer-events:none}body.mode-stage #character-overlay{background:linear-gradient(180deg,transparent 0%,rgba(242,179,61,0.2) 100%)}#character-img.mode-stage{filter:grayscale(0.5) contrast(1.1) brightness(1) sepia(0.3)}@keyframes kenBurns{0%{transform:scale(1) translateY(0)}100%{transform:scale(1.08) translateY(-2%)}}#silhouette-svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80%;height:90%;opacity:0;transition:opacity 0.5s ease}#silhouette-svg.visible{opacity:1}.pulse-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:2px solid var(--accent-primary);border-radius:50%;opacity:0;pointer-events:none}#particles-canvas,#equalizer-canvas,#ripple-canvas{position:absolute;top:0;left:0}#particles-canvas{z-index:3}#equalizer-canvas{z-index:4;bottom:0}#ripple-canvas{z-index:5}#clock-container{position:absolute;left:8%;top:35%;color:var(--text-main);text-shadow:3px 3px 0px rgba(0,0,0,0.8),0 0 20px rgba(0,0,0,0.5)}#time-display{font-family:"RocknRoll One","Yu Gothic",sans-serif;font-size:12vw;line-height:1;letter-spacing:-0.05em;display:flex;align-items:baseline}#hours,#minutes{font-weight:700}#colon{animation:blink 1s step-end infinite;margin:0 0.02em}@keyframes blink{50%{opacity:0}}#weekday{font-family:"Zen Kaku Gothic New",sans-serif;font-size:2vw;margin-top:0.5rem;opacity:0.9;letter-spacing:0.2em}#date-column{position:absolute;left:-3rem;top:100%;writing-mode:vertical-rl;text-orientation:mixed;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.2rem;opacity:0.7;letter-spacing:0.1em;height:200px}#greeting{position:absolute;left:8%;top:15%;color:var(--text-main);text-shadow:2px 2px 0px rgba(0,0,0,0.8)}#greeting-jp{font-family:"RocknRoll One",sans-serif;font-size:2.5rem;display:block}#greeting-en{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1rem;opacity:0.7;letter-spacing:0.3em;text-transform:uppercase}#marquee-container{position:absolute;left:8%;bottom:8%;right:20%;height:3rem;overflow:hidden;display:flex;align-items:center}.marquee-track{display:flex;align-items:center;animation:marqueeScroll 30s linear infinite;white-space:nowrap}.marquee-item{font-family:"RocknRoll One",sans-serif;font-size:1.8rem;color:var(--text-main);text-shadow:2px 2px 0px rgba(0,0,0,0.8);margin-right:4rem;display:flex;align-items:center;gap:1rem}.equalizer-glyph{width:20px;height:20px;display:flex;align-items:flex-end;gap:2px}.eq-bar{width:4px;background:var(--accent-primary);animation:eqBounce 0.5s -radius:50%;border:1px solid var(--accent-primary);transform:translate(-50%,-50%);pointer-events:none;opacity:0.5;transition:opacity 0.3s ease}.cursor-hidden #cursor-dot,.cursor-hidden #cursor-trail{opacity:0}.focus-mode #clock-container,.focus-mode #greeting,.focus-mode #marquee-container,.focus-mode #hanko-seal,.focus-mode #signature,.focus-mode #era-indicator,.focus-mode #date-column{opacity:0;transition:opacity 1s ease}#transition-flash{position:fixed;top:0;left:0;width:100%;height:100%;background:white;opacity:0;pointer-events:none;z-index:1000;transition:opacity 0.6s ease}#transition-flash.active{opacity:1}#ado-wordmark{position:absolute;right:15%;top:15%;font-family:"RocknRoll One",sans-serif;font-size:4rem;color:var(--text-main);text-shadow:3px 3px 0px rgba(0,0,0,0.8);letter-spacing:0.5em;opacity:0.8}.wordmark-glitch{animation:glitch 0.3s ease-in-out}@keyframes glitch{0%{transform:translate(0);filter:skewX(0deg)}20%{transform:translate(-3px,2px);filter:skewX(10deg)}40%{transform:translate(3px,-2px);filter:skewX(-10deg)}60%{transform:translate(-2px,1px);filter:skewX(5deg)}80%{transform:translate(2px,-1px);filter:skewX(-5deg)}100%{transform:translate(0);filter:skewX(0deg)}}.spotlight-beam{position:absolute;width:40vw;height:100vh;background:linear-gradient(180deg,rgba(242,179,61,0.15) 0%,transparent 80%);transform-origin:top center;pointer-events:none;opacity:0;mix-blend-mode:screen}body.mode-stage .spotlight-beam{opacity:1}#beam-left{top:0;left:10%;transform:rotate(15deg);animation:beamSweepLeft 20s ease-in-out infinite alternate}#beam-right{top:0;right:10%;transform:rotate(-15deg);animation:beamSweepRight 25s ease-in-out infinite alternate}@keyframes beamSweepLeft{0%{transform:rotate(10deg) scaleX(1)}100%{transform:rotate(20deg) scaleX(1.2)}}@keyframes beamSweepRight{0%{transform:rotate(-10deg) scaleX(1)}100%{transform:rotate(-20deg) scaleX(1.2)}}#loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-deep);display:flex;align-
