# Petrified Configuration
# A vanilla Weeping Angel plugin using ArmorStands

# Enable/disable the plugin
enabled: true

# Maximum number of angels allowed on the server
max-angels: 50

# How often (in ticks) to check angel states (20 ticks = 1 second)
check-interval-ticks: 20

# Radius within which angels detect players
detection-radius: 32

# Radius within which players feel dread effects
dread-radius: 16

# Movement speed for pursuing angels (blocks per tick)
movement-speed: 0.15

# Attack range (how close to player before attack)
attack-range: 2.5

# Require line of sight for quantum locking
require-line-of-sight: true

# Use player FOV/camera direction for detection
use-fov: true

# Blocks that can trap angels via reflection (mirror trap)
mirror-reflective-blocks:
  - GLASS
  - WHITE_STAINED_GLASS
  - ORANGE_STAINED_GLASS
  - MAGENTA_STAINED_GLASS
  - LIGHT_BLUE_STAINED_GLASS
  - YELLOW_STAINED_GLASS
  - LIME_STAINED_GLASS
  - PINK_STAINED_GLASS
  - GRAY_STAINED_GLASS
  - LIGHT_GRAY_STAINED_GLASS
  - CYAN_STAINED_GLASS
  - PURPLE_STAINED_GLASS
  - BLUE_STAINED_GLASS
  - BROWN_STAINED_GLASS
  - GREEN_STAINED_GLASS
  - RED_STAINED_GLASS
  - BLACK_STAINED_GLASS
  - SEA_LANTERN
  - GLOWSTONE
  - POLISHED_ANDESITE
  - POLISHED_DIORITE
  - POLISHED_GRANITE
  - QUARTZ_BLOCK
  - SMOOTH_QUARTZ

# Combat settings
combat:
  # Number of pickaxe hits required to kill an angel
  required-pickaxe-hits: 3
  # Cooldown between hits (ticks)
  hit-cooldown-ticks: 10
  # Number of crack stages before death
  crack-stages: 3
  # Loot dropped on angel death (format: MATERIAL:min-max)
  death-loot:
    - COBBLESTONE:2-5
    - GRAVEL:1-3

# Time displacement attack settings
displacement:
  # Mode: DISPLACE (teleport), KILL, or DAMAGE
  mode: DISPLACE
  # Anchor for displacement: spawn, bed, anchor, or random
  anchor: spawn
  # Effects applied after displacement
  effects:
    - BLINDNESS
    - SLOWNESS
    - NAUSEA
  # Duration of effects in seconds
  duration-seconds: 5

# Sensory horror effects
sensory:
  # Title shown when angel is near
  title: "&c&DON'T BLINK"
  # Action bar message
  actionbar: "&8You feel watched..."
  # Sound effect
  sound: AMBIENT_CAVE
  # Show particles
  particles: true
  # Intensity (0.0 to 1.0)
  intensity: 0.5

# Performance settings
performance:
  # Max LOS checks per player per interval
  per-player-los-budget: 5
  # Reduce checks based on view distance
  view-distance-aware: true
  # Auto-reduce quality if TPS drops
  auto-quality: true

# Integration settings
integrations:
  # PlaceholderAPI support
  placeholderapi: true
  # bStats metrics
  bstats: true
  # Update checker
  update-checker: true

# Language settings
lang:
  # Locale: en_US, id_ID
  locale: en_US

# Debug mode (verbose logging)
debug: false

# Natural spawning settings
natural-spawning:
  enabled: true
  # Interval between spawn attempts (ticks)
  interval-ticks: 200
  # Chance of spawn per attempt (0.0 to 1.0)
  chance: 0.02
  # Light level range for spawning
  light-min: 0
  light-max: 7
  # Radius around players to spawn
  near-player-radius: 24
  # Bias toward structures (ruins, caves)
  structure-bias: true

# Manual spawning settings
spawning:
  # Free block count threshold for cramped area
  cramped-threshold: 15
  # Free block count threshold for open area
  open-threshold: 40
  # Cluster size settings
  cluster-min: 2
  cluster-max: 4
  cluster-radius: 5.0

# Persistence settings
persistence:
  enabled: true
  # File to store angel data
  file: angels.yml
