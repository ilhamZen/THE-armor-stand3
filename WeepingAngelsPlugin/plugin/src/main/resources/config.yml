# Petrified Plugin Configuration
# Weeper monsters with quantum locking mechanics

enabled: true

# Maximum number of Weepers allowed per world
max-weepers: 50

# Detection radius in blocks
detection-radius: 32

# Require line of sight for quantum locking
require-line-of-sight: true

# Attack range in blocks
attack-range: 2.5

# Movement speed (blocks per tick)
movement-speed: 0.15

# AI check interval in ticks
check-interval-ticks: 2

# Debug mode
debug: false

# Quantum Teleportation Curse settings
quantum-teleport:
  enabled: true
  min-distance: 300
  max-distance: 500
  potion-duration-ticks: 100
